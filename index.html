  const r=PR.filter(p=>!q||p.id.toLowerCase().includes(q)||p.name.includes(q));
  return r.length?r.map(p=>`<div class="li" style="cursor:pointer" onclick="prodSheet('${p.id}')">${thumb(p)}<div class="g"><div class="n">${esc(p.name)}</div><div class="s">货号 ${p.id} · 共 ${p.v.length} 色 · 库存 ${p.v.reduce((a,v)=>a+v[1],0)}</div></div><div>${f2(p.price)}</div></div>`).join(""):'<div class="empty"><p>没有找到商品</p></div>';
}
function render(keep){persist();
  const m=$("main"),sc=m.scrollTop;
  document.querySelectorAll("#tabs button").forEach(b=>b.className=b.dataset.t==S.tab?"on":"");

    $("top").innerHTML=`<div class="srch" style="width:100%"><button onclick="openSearch()" style="text-align:left">${I.search}搜索货号</button><button onclick="listAll()">${I.grid}商品列表</button></div>`;

    let o=S.orders.filter(x=>!S.hq||String(x.no).includes(S.hq)||x.cl.toLowerCase().includes(S.hq.toLowerCase()));
    if(S.sort=="amt")o=[...o].sort((a,b)=>b.a-a.a);

  }else{
    $("top").innerHTML=`<div class="top" style="width:100%;padding:0"><button class="ico" style="color:var(--ink)" aria-label="扫一扫" onclick="scanIt()">${I.scan}</button><div class="sp" style="text-align:center;font-size:21px;font-weight:600">更多</div><button class="ico" style="color:var(--ink)" aria-label="账户" onclick="toast('当前账户：演示')">${I.user}</button></div>`;

     <div class="sec">管理</div>${G([["tool","清除数据","resetAll()"],["sync","导出备份","exportData()"],["lock","导入备份","importMenu()"]])}
     <div class="sec">工具</div>${G([["tag","新建商品","newP()"],["scan","扫一扫","scanIt()"],["card","种类管理","catManage()"]])}
     <div class="sec">服务</div>${G([["help","帮助中心","toast('帮助中心')"]])}
     <div class="sec">其他</div>${G([["ver","标准版","toast('版本 1.0.0')"],["net","网络检测","toast('网络正常')"]])}`;
  }

function aSave(){
  if(!(AD.name.trim()&&AD.addr.trim())){toast("请填写收货人和详细地址");return}

let ND=null;
function dlg(title,init,cb,num){
  ND={cb,num,v:String(init==null?"":init),fresh:!!num};
  const kp=num?`<div class="kp"><div class="hd" onclick="ndK('ok')"><svg viewBox="0 0 24 24" width="40"><path d="M4 9l8 6 8-6"/></svg></div><div class="kg">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="ndK('${n}')">${n}</button>`).join("")}<button disabled></button><button onclick="ndK('0')">0</button><button onclick="ndK('.')">.</button><button class="bs" aria-label="删除" onclick="ndK('<')"><svg viewBox="0 0 24 24" width="44"><path d="M9 6h11v12H9l-6-6z"/><path d="M12 9l5 6M17 9l-5 6"/></svg></button></div></div>`:"";
  $("nd").innerHTML=`<div class="bd" onclick="ndX()"></div><div class="box"><h4>${esc(title)}</h4>${num?`<div id="ndv" class="val"></div>`:`<input id="ndi" class="val" value="${esc(ND.v)}" onkeydown="if(event.key=='Enter')ndK('ok')">`}<div class="ac"><button onclick="ndX()">取消</button><button onclick="ndK('ok')">确定</button></div></div>${kp}`;
  ndShow();if(!num){const i=$("ndi");i.focus();i.select()}
}
function ndShow(){const e=$("ndv");if(e){e.textContent=ND.v;e.className="val"+(ND.fresh?" ph":"")}}
function ndK(k){
  if(!ND)return;
  if(k=="ok"){const v=ND.num?ND.v:$("ndi").value,cb=ND.cb;$("nd").innerHTML="";ND=null;cb(v);return}
  if(k=="<"){ND.v=ND.fresh?"":ND.v.slice(0,-1);ND.fresh=false}
  else{if(ND.fresh){ND.v="";ND.fresh=false}if(k=="."&&ND.v.includes("."))return;if(ND.v=="0"&&k!=".")ND.v="";ND.v+=k}
  ndShow();
}
function ndX(){$("nd").innerHTML="";ND=null}
function numOf(v){const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n}
let CATS=["PANTALON","JUPES","ROBES","T-SHIRT","CAMISETA"],CPK=null;
function catPick(title,cur,cb,clear){
  CPK={cb};
  sheet(title,CATS.map((c,i)=>`<button class="opt" style="${c==cur?'font-weight:700':''}" onclick="catSel(${i})">${esc(c)}${c==cur?' ✓':''}</button>`).join("")+(clear&&cur?`<button class="opt" onclick="catSel(-1)">不设种类</button>`:"")+`<button class="opt" onclick="catAdd(1)">＋ 添加新种类…</button><button class="opt" onclick="cl();catManage()">管理种类（删除）</button>`);
}
function catSel(i){const cb=CPK&&CPK.cb;cl();if(cb)cb(i<0?"":CATS[i])}
function catAdd(pickIt){
  const cb=CPK&&CPK.cb;cl();
  dlg("添加新种类","",n=>{n=n.trim().slice(0,30);if(!n)return;if(!CATS.some(c=>c.toLowerCase()==n.toLowerCase()))CATS.push(n);else n=CATS.find(c=>c.toLowerCase()==n.toLowerCase());persist();if(pickIt&&cb)cb(n);else catManage()});
}
function catManage(){
  sheet("管理种类（点 ✕ 删除）",CATS.map((c,i)=>`<div class="li"><div class="g n">${esc(c)}</div><button class="ico" aria-label="删除" onclick="CATS.splice(${i},1);persist();catManage()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join("")||'<div class="nf">还没有种类</div>',`<button class="opt" onclick="CPK=null;catAdd(0)">＋ 添加新种类…</button>`,"完成");

const CAMI='<svg viewBox="0 0 24 24"><path d="M9 4l-1.5 2H5a2 2 0 00-2 2v10a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-2.5L15 4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
let PHC=null;
function thumb(p,fn){return p&&p.photo?`<img class="pth" src="${p.photo}" alt="" onclick="event.stopPropagation();${fn||`bigPhoto('${p.id}')`}">`:`<span class="pth" ${fn?`onclick="event.stopPropagation();${fn}"`:""}>${CAMI}</span>`}
function photoMenu(has,cb,delcb,view){
  PHC=cb;
  sheet("商品照片",(view?`<button class="opt" onclick="cl();${view}">查看大图</button>`:"")+`<label class="opt fl">拍照<input type="file" accept="image/*" capture="environment" onchange="readPhoto(this)"></label><label class="opt fl">从相册选择<input type="file" accept="image/*" onchange="readPhoto(this)"></label>`+(has?`<button class="opt" style="color:var(--red)" onclick="cl();PHC=null;(${delcb})()">删除照片</button>`:""));

function readPhoto(inp){

    <div class="rw"><div class="l">库存数量</div><input class="f" inputmode="numeric" placeholder="${F.colors.length?'按颜色分别填写':'0'}" value="${esc(F.stock)}" oninput="F.stock=this.value"></div>
    <div class="rw" style="cursor:pointer" onclick="pick('origin',['中国','西班牙','土耳其','未选择'])"><div class="l w">原产地</div><div class="v">${F.origin}</div>${CH}</div>
    <div class="gap"></div>
    <div class="rw" style="cursor:pointer" onclick="catPick('系统分类',F.cat,n=>{F.cat=n;fRender()})"><div class="l w">系统分类</div><div class="v k">${F.cat}</div>${CH}</div>
    <div class="gap"></div>
    <div class="rw"><div class="l w">Supplier</div>${tg("sup")}</div>
    <div class="rw"><div class="l w">To define1</div>${tg("d1")}</div>
    <div class="rw"><div class="l w">To define2</div>${tg("d2")}</div>`;
  }else{
    const q=F.cq.trim().toLowerCase();
    let cs=F.colors.map((c,i)=>({c,i})).filter(x=>!q||x.c[0].toLowerCase().includes(q));
    cs.sort((a,b)=>F.asc?a.c[0].localeCompare(b.c[0]):b.c[0].localeCompare(a.c[0]));
    body=`<label class="sbox">${I.search}<input placeholder="搜索" value="${esc(F.cq)}" oninput="F.cq=this.value;fRender();const e=document.querySelector('.sbox input');e.focus();e.setSelectionRange(99,99)"></label>
    <div class="cbar"><button style="flex:1" onclick="addColor()">添加颜色</button><button class="ico" style="color:var(--blue);border-left:1px solid var(--line);border-radius:0;min-width:56px" aria-label="排序" onclick="F.asc=!F.asc;fRender()"><svg viewBox="0 0 24 24" stroke-width="2.6"><path d="M3 6h18M3 12h12M3 18h7"/></svg></button></div>
    ${cs.map(x=>`<div class="li"><div class="g"><div class="n">${esc(x.c[0])}</div><div class="s">库存 <u onclick="fcStock(${x.i})" style="cursor:pointer;padding:6px 2px;color:var(--blue)">${x.c[1]}</u></div></div><button class="ico" aria-label="删除" onclick="F.colors.splice(${x.i},1);fRender()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join("")}`;
  }
  $("pg").innerHTML=`<div class="pg">${head}<div class="fb">${body}</div></div>`;
}
function fSave(cont){
  const id=F.code.trim().replace(/['"\\<>&\s]/g,"");
  if(!id){toast("请填写货号");return}
  if(!(parseInt(F.pack)>=1)){toast("包装数至少为 1");return}
  let uid=id,n=1;while(PR.some(p=>p.id.toLowerCase()==uid.toLowerCase()))uid=id+"-"+(++n);
  PR.push({id:uid,name:id,cat:F.cat,photo:F.photo||undefined,price:parseFloat(String(F.price).replace(",","."))||0,v:F.colors.length?F.colors.map(c=>[c[0],c[1]]):[["默认",parseInt(F.stock)||0]]});
  if(F.photo)phSave(uid,F.photo);
  if(cont){newForm.call(null);F.code="";fRender();toast(uid!=id?"货号重复，已存为 "+uid:"已保存，继续新建")}
  else{toast(uid!=id?"货号重复，已存为 "+uid:"商品已保存");closePg();tab("s")}
}
function newP(){SP.q="";newForm()}
function place(){
  S.orders.unshift({no:S.seq++,cl:S.client,u:units(),d:new Date().toLocaleDateString("en-GB").slice(0,5),a:+tot().toFixed(2),tax:S.tax,L:lines().map(l=>({n:l.p.name,c:l.c,q:l.q,amt:l.amt}))});
  if(S.doc!="报价单"){const sg=S.doc=="退货单"?1:-1;lines().forEach(l=>{const v=l.p.v.find(x=>x[0]==l.c);if(v)v[1]+=sg*l.q})}
  S.cart={};S.open=false;toast(S.doc+"已提交");tab("h")
}
function detail(no){
  const o=S.orders.find(x=>x.no==no);
  sheet("#"+o.no+" · "+o.cl,(o.L.length?o.L.map(l=>`<div class="li"><div class="g"><div class="n">${l.n}</div><div class="s">${l.c}</div></div><div>${l.q} × = ${f2(l.amt)}</div></div>`).join(""):'<div class="li"><div class="g s" style="color:var(--mute)">示例订单，无明细</div></div>')+`<div class="li"><div class="g n">合计 ${o.u} 件${o.tax?'<span class="pill">含税</span>':""}</div><div class="n">${f2(o.a)}</div></div>`,`<button class="opt" onclick="cl();printMenu(${o.no})">打印</button>`,"关闭");
}

var _db=null;
function phDB(){return _db||(_db=new Promise((ok,no)=>{try{const r=indexedDB.open("kdb_photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("ph");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}))}
function phSave(id,url){phDB().then(d=>d.transaction("ph","readwrite").objectStore("ph").put(url,id)).catch(()=>toast("照片无法保存到手机，请换浏览器"))}
function phDel(id){phDB().then(d=>d.transaction("ph","readwrite").objectStore("ph").delete(id)).catch(()=>{})}
function phLoad(){phDB().then(d=>{const st=d.transaction("ph").objectStore("ph"),r=st.openCursor();r.onsuccess=()=>{const c=r.result;if(c){const p=P(c.key);if(p)p.photo=c.value;c.continue()}else render(1)}}).catch(()=>{});try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}

function phAll(){return phDB().then(d=>new Promise(ok=>{const o={},r=d.transaction("ph").objectStore("ph").openCursor();r.onsuccess=()=>{const c=r.result;if(c){o[c.key]=c.value;c.continue()}else ok(o)};r.onerror=()=>ok(o)})).catch(()=>({}))}
async function exportData(){
  toast("正在打包…");
  persist();
  const ph=await phAll();
  const txt=JSON.stringify({app:"kaidanbao",v:1,t:Date.now(),ls:localStorage.getItem(KEY)||"",photos:ph});
  const fn="kaidanbao-backup-"+new Date().toISOString().slice(0,10)+".json";
  const blob=new Blob([txt],{type:"application/json"});
  try{const dl=window.claude&&claude.use?await claude.use("downloads"):null;
    if(dl){await dl.save({filename:fn,data:blob});toast("备份已保存");return}}catch(e){if(e&&e.code=="declined")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},4000);toast("备份已保存到下载")}catch(e){toast("此环境无法导出，请换浏览器")}
}
function importMenu(){sheet("导入备份",`<div class="li"><div class="g s" style="color:var(--mute)">选择之前导出的 .json 备份文件。导入会替换当前所有商品、客户、订单和照片。</div></div><label class="opt fl">选择备份文件<input type="file" accept=".json,application/json" onchange="importData(this)"></label>`)}
function importData(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    let d;try{d=JSON.parse(r.result);if(d.app!="kaidanbao"||typeof d.ls!="string")throw 0}catch(e){toast("这不是有效的备份文件");return}
    try{
      localStorage.setItem(KEY,d.ls);
      const db=await phDB();
      await new Promise((ok,no)=>{const tx=db.transaction("ph","readwrite"),st=tx.objectStore("ph");st.clear();Object.keys(d.photos||{}).forEach(k=>st.put(d.photos[k],k));tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});
      cl();toast("导入成功，正在刷新…");setTimeout(()=>location.reload(),600);
    }catch(e){toast("导入失败：存储空间不足或被禁用")}
  };
  r.readAsText(f);
}
var KEY="kaidanbao_v1";
function persist(){try{localStorage.setItem(KEY,JSON.stringify({PR:PR.map(p=>{const q={...p};delete q.photo;return q}),CU,orders:S.orders,seq:S.seq,client:S.client,cart:S.cart,lo:S.lo,CATS}))}catch(e){if(!window._pw){window._pw=1;toast("存储空间已满，新数据可能没保存")}}}
function resetAll(){sheet("清除所有商品、客户、订单和库存数据？",'<button class="opt" style="color:var(--red)" onclick="try{localStorage.removeItem(KEY)}catch(e){}try{indexedDB.deleteDatabase(\'kdb_photos\')}catch(e){}setTimeout(()=>location.reload(),300)">确认清除</button>')}
try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d){if(d.PR){PR.splice(0,PR.length,...d.PR);PR.forEach(p=>{if(p.photo)phSave(p.id,p.photo)})}if(d.CU)CU.splice(0,CU.length,...d.CU);S.orders=d.orders||[];S.seq=d.seq||S.seq;if(d.client)S.client=d.client;if(d.cart)S.cart=d.cart;if(d.lo)S.lo=d.lo;if(d.CATS)CATS=d.CATS}}catch(e){}
render();phLoad();
</script><script>if("serviceWorker" in navigator&&location.protocol=="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script></body></html>
